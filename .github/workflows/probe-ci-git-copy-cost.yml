name: Measure Windows Git fixture copy cost
on:
  push:
    branches: [bb/probe-ci-git-copy-cost]
permissions:
  contents: read
jobs:
  compare:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: node .github/scripts/probe-ci-git-copy-cost.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: copy-cost-results
          path: ${{ runner.temp }}/git-copy-cost.json
