name: Compare ordered parallel ASAR preparation
on:
  push:
    branches: [bb/benchmark-asar-preparation]
permissions:
  contents: read
jobs:
  compare:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        order: [baseline-first, candidate-first]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      BB_DESKTOP_BUILD_DATE: '2026-10-28T00:00:00.000Z'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 1
        continue-on-error: true
      - uses: ./.github/actions/cache-react-compiler
        timeout-minutes: 1
        continue-on-error: true
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Warm complete desktop package and prerequisites
        run: pnpm exec turbo run package:win --filter=@bb/desktop --output-logs=errors-only --env-mode=loose
      - name: Compare complete packages and run real smokes
        env:
          BENCHMARK_ORDER: ${{ matrix.order }}
        run: node .github/scripts/benchmark-asar-preparation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: asar-preparation-${{ matrix.order }}
          path: ${{ runner.temp }}/asar-benchmark/
