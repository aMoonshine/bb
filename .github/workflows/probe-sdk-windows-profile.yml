name: Profile Windows SDK declaration build
on:
  push:
    branches: [bb/probe-sdk-windows-profile]
permissions:
  contents: read
jobs:
  profile:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 1
        continue-on-error: true
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Warm SDK declarations and prerequisites
        run: pnpm exec turbo run build:types --filter=@get-bb/plugin-sdk --output-logs=errors-only
      - name: Profile the unchanged Windows compiler build
        working-directory: packages/plugin-sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/sdk-profile" | Out-Null
          node --cpu-prof --cpu-prof-dir="$env:RUNNER_TEMP/sdk-profile" --trace-gc scripts/build-bundled-dts.mjs *> "$env:RUNNER_TEMP/sdk-profile/build.log"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-sdk-profile
          path: ${{ runner.temp }}/sdk-profile/
